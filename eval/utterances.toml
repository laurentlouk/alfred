# Requests Alfred should handle, for `alfred eval` (and a test that checks the router's share).
# `tool` is the first tool expected, "ask" for a follow-up question, or "chat" for an answer in words.
# `expect` maps an action field to text it must contain (case-insensitive).

# --- router-shaped: everyday phrasings ---------------------------------------------------------------
[[case]]
text = "open notes"
tool = "open_app"
expect = { name = "notes" }

[[case]]
text = "Hey Alfred, could you open Safari please?"
tool = "open_app"
expect = { name = "safari" }

[[case]]
text = "launch spotify"
tool = "open_app"
expect = { name = "spotify" }

[[case]]
text = "open youtube"
tool = "open_url"
expect = { url = "youtube.com" }

[[case]]
text = "go to github.com"
tool = "open_url"
expect = { url = "github.com" }

[[case]]
text = "quit music"
tool = "quit_app"
expect = { name = "music" }

[[case]]
text = "take a note: buy oat milk"
tool = "create_note"
expect = { body = "oat milk" }

[[case]]
text = "open Notes and save that the boiler service is on Friday"
tool = "create_note"
expect = { body = "boiler service" }

[[case]]
text = "open Notes and save something for me"
tool = "ask"

[[case]]
text = "save a note that I need to buy milk tomorrow"
tool = "create_note"
expect = { body = "buy milk" }

[[case]]
text = "remember that the spare key is under the blue pot"
tool = "create_note"
expect = { body = "spare key" }

[[case]]
text = "create a note called Gift ideas with a fountain pen for dad"
tool = "create_note"
expect = { title = "gift ideas", body = "fountain pen" }

[[case]]
text = "remind me to call the dentist"
tool = "create_reminder"
expect = { title = "dentist" }

[[case]]
text = "remind me in 20 minutes to take the pizza out"
tool = "create_reminder"
expect = { title = "pizza", minutes = "20" }

[[case]]
text = "set a reminder to stretch in an hour"
tool = "create_reminder"
expect = { minutes = "60" }

[[case]]
text = "search google for the rune ui framework"
tool = "web_search"
expect = { query = "rune ui framework" }

[[case]]
text = "google kokoro text to speech"
tool = "web_search"
expect = { query = "kokoro" }

[[case]]
text = "look up the weather in Lisbon"
tool = "web_search"
expect = { query = "weather in lisbon" }

[[case]]
text = "open safari and search for train times to Bath"
tool = "web_search"
expect = { query = "train times", browser = "safari" }

[[case]]
text = "what time is it?"
tool = "get_time"

[[case]]
text = "what's the date"
tool = "get_time"

[[case]]
text = "take a note"
tool = "ask"

[[case]]
text = "read my last email"
tool = "read_mail"

[[case]]
text = "reply to my latest email saying I'll be there at 3"
tool = "reply_mail"
expect = { text = "there at 3" }

[[case]]
text = "réponds au dernier mail de Marie en disant merci"
tool = "reply_mail"
expect = { from = "marie", text = "merci" }

[[case]]
text = "anything new in my inbox?"
tool = "read_mail"

