text = "what's the weather in Paris"
tool = "web_search"
expect = { query = "paris" }

[[case]]
text = "who won the last Champions League final"
tool = "web_search"
expect = { query = "champions league" }

[[case]]
text = "what time is it in Tokyo"
tool = "web_search"
expect = { query = "tokyo" }

[[case]]
text = "is the Louvre open today"
tool = "web_search"
